name: Build_FritzBox_7490

on:
  workflow_dispatch:

concurrency:
  group: build-7490
  cancel-in-progress: true
  queue: single

jobs:
  build:
    permissions:
      packages: read
      contents: write
    runs-on: ubuntu-24.04
    if: github.repository != 'freetz-ng/freetz-ng' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: System vorbereiten und Compiler installieren
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y install \
            locales pv cpio rsync kmod imagemagick inkscape graphicsmagick subversion git bc unar wget sudo gcc g++ binutils autoconf automake \
            autopoint libtool-bin make bzip2 libreadline-dev zlib1g-dev flex bison patch texinfo gettext pkg-config ecj \
            perl libstring-crc32-perl ruby gawk libusb-dev unzip intltool libacl1-dev libcap-dev libc6-dev-i386 \
            libelf-dev libncurses-dev gcc-multilib bsdmainutils lib32stdc++6 libglib2.0-dev ccache cmake lib32z1-dev libsqlite3-dev sqlite3 libzstd-dev \
            netcat-openbsd curl uuid-dev libssl-dev libgnutls28-dev u-boot-tools device-tree-compiler

      - name: Spracheinstellungen einrichten
        run: |
          sudo locale-gen en_US.utf8 && sudo locale-gen de_DE.UTF-8
          sudo update-locale LANG=de_DE.UTF-8

      - name: Eigene .config einspielen
        run: |
          # 1. Sauberes Aufräumen zu Beginn
          make dirclean
          mkdir -p images
          
          # Behebt den SSL-Abbruch bei den BusyBox-Host-Tools auf den GitHub-Servern
          echo "check_certificate = off" >> ~/.wgetrc
          
          # =================================================================
          # STUFE 1: Nur Identifikation und ALLE primären Türöffner setzen
          # =================================================================
          echo "FREETZ_SERIES_4=y" > .config
          echo "FREETZ_TYPE_7490=y" >> .config
          echo "FREETZ_TYPE_FIRMWARE_07_5X=y" >> .config
          
          # Die 3 zwingenden System-Türöffner (Schalten die Menü-Bäume im Quellcode frei)
          echo "FREETZ_USER_LEVEL_EXPERT=y" >> .config
          echo "FREETZ_TARGET_IPV6_SUPPORT=y" >> .config
          echo "FREETZ_REPLACE_KERNEL=y" >> .config
          
          # Erster Durchlauf: Freetz erzeugt das vollständige, valide 3000-Zeilen-Gerüst.
          # Da IPv6 und Expert aktiv sind, existieren nun alle Optionen als definierte Zeilen!
          make olddefconfig
          
          # =================================================================
          # STUFE 2: Präzises In-Place-Umbiegen der nun existierenden Zeilen
          # =================================================================
          
          # 1. Wir brechen die harten AVM-Konfliktsperren auf, die jetzt garantiert in der Datei stehen
          sed -i 's/FREETZ_PACKAGE_DNSMASQ_DISABLE_DHCP=y/# FREETZ_PACKAGE_DNSMASQ_DISABLE_DHCP is not set/' .config
          sed -i 's/FREETZ_PACKAGE_DNSMASQ_DISABLE_DNS=y/# FREETZ_PACKAGE_DNSMASQ_DISABLE_DNS is not set/' .config
          
          # 2. Wir schalten die automatische Deaktivierung im Freetz-Kern dauerhaft aus
          sed -i 's/FREETZ_PACKAGE_DNSMASQ_AUTO_DISABLE=y/FREETZ_PACKAGE_DNSMASQ_AUTO_DISABLE=n/' .config
          
          # 3. Wir biegen die Hauptpakete von "not set" auf aktiv (=y) um
          sed -i 's/# FREETZ_PACKAGE_DNSMASQ is not set/FREETZ_PACKAGE_DNSMASQ=y/' .config
          sed -i 's/# FREETZ_PACKAGE_IPTABLES is not set/FREETZ_PACKAGE_IPTABLES=y/' .config
          
          # 4. Wir schalten die für NAT66 wichtigen Unteroptionen direkt in ihren Zeilen scharf
          sed -i 's/# FREETZ_PACKAGE_DNSMASQ_WITH_DHCP is not set/FREETZ_PACKAGE_DNSMASQ_WITH_DHCP=y/' .config
          sed -i 's/# FREETZ_PACKAGE_DNSMASQ_WITH_IPV6 is not set/FREETZ_PACKAGE_DNSMASQ_WITH_IPV6=y/' .config
          sed -i 's/# FREETZ_PACKAGE_IPTABLES_MOD_IP6TABLES is not set/FREETZ_PACKAGE_IPTABLES_MOD_IP6TABLES=y/' .config
          sed -i 's/# FREETZ_PACKAGE_IPTABLES_MOD_CONNTRACK_EXTRA is not set/FREETZ_PACKAGE_IPTABLES_MOD_CONNTRACK_EXTRA=y/' .config
          sed -i 's/# FREETZ_PACKAGE_IPTABLES_MOD_NAT_EXTRA is not set/FREETZ_PACKAGE_IPTABLES_MOD_NAT_EXTRA=y/' .config
          
          # 5. Wir schalten die zwingenden Shared Libraries für den Compiler direkt in ihren Zeilen scharf
          sed -i 's/# FREETZ_LIB_libusb0 is not set/FREETZ_LIB_libusb0=y/' .config
          sed -i 's/# FREETZ_LIB_libusb1 is not set/FREETZ_LIB_libusb1=y/' .config
          sed -i 's/# FREETZ_LIB_libcrypto is not set/FREETZ_LIB_libcrypto=y/' .config
          sed -i 's/# FREETZ_OPENSSL_VERSION_35 is not set/FREETZ_OPENSSL_VERSION_35=y/' .config

          # =================================================================
          # STUFE 3: Kernel-Templates impfen & Finaler Abhängigkeitsabgleich
          # =================================================================
          find kernel/config/ -type f -name "*.config" | while read -r config_file; do
            sed -i '/CONFIG_IP6_NF_/d' "$config_file"
            sed -i '/CONFIG_NF_CONNTRACK_IPV6/d' "$config_file"
            
            echo "CONFIG_IP6_NF_IPTABLES=m" >> "$config_file"
            echo "CONFIG_IP6_NF_MATCH_HL=m" >> "$config_file"
            echo "CONFIG_IP6_NF_TARGET_HL=m" >> "$config_file"
            echo "CONFIG_IP6_NF_MANGLE=m" >> "$config_file"
            echo "CONFIG_IP6_NF_NAT=m" >> "$config_file"
            echo "CONFIG_IP6_NF_TARGET_MASQUERADE=m" >> "$config_file"
            echo "CONFIG_NF_CONNTRACK_IPV6=m" >> "$config_file"
          done
          
          # Zweiter Durchlauf: Validiert die manipulierten Daten final und zieht Unter-Abhängigkeiten nach
          make olddefconfig
          
          # 6. Kompakte Bildschirmausgabe zur Kontrolle
          echo -e "\n================ KOPPIEREN FUER DEN CHAT AB HIER ================"
          grep -E "7490|IPV6|DNSMASQ|IPTABLES|NETFILTER|FREETZ_MODULES|REPLACE_KERNEL" .config
          echo -e "================ KOPPIEREN FUER DEN CHAT BIS HIER ================\n"
          
          # 7. Sicherheitsprüfung gegen unvollständigen Reset auf die Standard-7690
          if grep -q "FREETZ_TYPE_7690=y" .config; then
            echo "FEHLER: Konfiguration wurde von Freetz verworfen und auf Standard (7690) zurückgesetzt!"
            exit 1
          fi

      - name: Firmware kompilieren
        run: |
          make

      - name: Variablen vorbereiten
        id: vars
        run: |
          LAST_FILE="$(ls images/*.image | head -n 1 | xargs basename)"
          NAME_FILE="$(echo "$LAST_FILE" | sed 's,_[0-9]*,,;s,\.image,,')"
          echo "last=${LAST_FILE}" >> $GITHUB_OUTPUT
          echo "name=${NAME_FILE}" >> $GITHUB_OUTPUT
          test -n "${NAME_FILE}"

      - name: Firmware als Release hochladen
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.vars.outputs.name }}
          name: ${{ steps.vars.outputs.name }}
          body: |
            Build fuer FRITZ!Box 7490 erfolgreich abgeschlossen.
            Die fertige Datei befindet sich im Anhang.
          prerelease: false
          allowUpdates: true
          artifacts: "images/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
