name: Make_xyMEyx_get_nameversion

on:
  workflow_dispatch:

jobs:
  extract:
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Tiefenanalyse der neuen Freetz-Struktur
        run: |
          mkdir -p output
          {
            echo "=== ECHTE FREETZ-NG MODELL-VARIABLEN (2026) ==="
            echo "1. Suche nach Hardware-Definitionen im config-Ordner:"
            echo "--------------------------------------------------------"
            if [ -d "config" ]; then
              grep -r -E "config FREETZ_TYPE_7490|config FREETZ_TYPE_7590" config/ || echo "Keine exakten Treffer in config/"
            else
              echo "Ordner 'config' existiert nicht!"
            fi
            echo "--------------------------------------------------------"
            echo "2. Inhalt der zentralen Firmware-Menüdatei (Auszug):"
            echo "--------------------------------------------------------"
            if [ -f "config/ui/firmware.in" ]; then
              grep -E "bool \"FRITZ\!Box" config/ui/firmware.in | grep -E "7490|7590" || echo "Boxen nicht im UI-Menue gefunden"
            else
              echo "config/ui/firmware.in existiert nicht!"
            fi
            echo "--------------------------------------------------------"
            echo "3. Gueltige Firmware-Linien im Projekt:"
            echo "--------------------------------------------------------"
            grep -r -m 5 "FREETZ_TYPE_FIRMWARE_" config/ || echo "Keine Firmware-Typen gefunden"
          } > output/info.txt

      - name: Info-Text als Release hochladen
        uses: ncipollo/release-action@v1
        with:
          tag: "Freetz-Modellinfo"
          name: "Aktuelle Freetz-Variablen"
          body: "Die gezielte Suche in der neuen config-Struktur wurde abgeschlossen. Pruefen Sie den Inhalt der info.txt."
          prerelease: false
          allowUpdates: true
          artifacts: "output/info.txt"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
