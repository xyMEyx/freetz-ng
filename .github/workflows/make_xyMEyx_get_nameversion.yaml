name: Make_xyMEyx_get_nameversion

on:
  workflow_dispatch:

jobs:
  extract:
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Globale Struktur-Suche
        run: |
          mkdir -p output
          {
            echo "=== ECHTE FREETZ-NG MODELL-VARIABLEN ==="
            echo "Suche nach exakten Hardware-Definitionen fuer 7490 und 7590:"
            echo "--------------------------------------------------------"
            grep -r -E "config FREETZ_TYPE_7490|config FREETZ_TYPE_7590" make/ | sed 's,:.*,,g' | sort -u || echo "Keine Definitionen im make-Ordner gefunden"
            echo "--------------------------------------------------------"
            echo "Gefundene Firmware-Codezeilen im gesamten Projekt:"
            grep -r -m 3 "FREETZ_TYPE_FIRMWARE_" make/ || echo "Keine Firmware-Codes gefunden"
          } > output/info.txt

      - name: Info-Text als Release hochladen
        uses: ncipollo/release-action@v1
        with:
          tag: "Freetz-Modellinfo"
          name: "Aktuelle Freetz-Variablen"
          body: "Die globale Tiefensuche war erfolgreich. Die echten Variablennamen stehen in der info.txt."
          prerelease: false
          allowUpdates: true
          artifacts: "output/info.txt"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
