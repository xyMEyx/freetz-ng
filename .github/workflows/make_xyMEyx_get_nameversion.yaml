name: Make_xyMEyx_get_nameversion

on:
  workflow_dispatch:

jobs:
  extract:
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Komprimierte Datenabfrage
        run: |
          mkdir -p output
          {
            echo "7490"
            echo "FREETZ_TYPE_7490=y"
            echo "Firmware"
            if grep -q "FREETZ_TYPE_FIRMWARE_07_5X" config/ui/firmware.in; then
              echo "FREETZ_TYPE_FIRMWARE_07_5X=y"
            else
              echo "FREETZ_TYPE_FIRMWARE_07_5X nicht gefunden"
            fi
            echo ""
            echo "7590"
            if grep -q "FREETZ_TYPE_7590_W5" config/ui/firmware.in; then
              echo "FREETZ_TYPE_7590_W5=y"
            else
              echo "FREETZ_TYPE_7590_W5 nicht gefunden"
            fi
            echo "Firmware"
            if grep -q "FREETZ_TYPE_FIRMWARE_08_2X" config/ui/firmware.in; then
              echo "FREETZ_TYPE_FIRMWARE_08_2X=y"
            else
              echo "FREETZ_TYPE_FIRMWARE_08_2X nicht gefunden"
            fi
          } > output/info.txt

      - name: Info-Text als Release hochladen
        uses: ncipollo/release-action@v1
        with:
          tag: "Freetz-Modellinfo"
          name: "Aktuelle Freetz-Variablen"
          body: "Der optimierte Kurz-Report wurde erfolgreich erstellt."
          prerelease: false
          allowUpdates: true
          artifacts: "output/info.txt"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
